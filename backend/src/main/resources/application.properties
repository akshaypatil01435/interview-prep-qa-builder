spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/interview_prep?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=Asia/Kolkata}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

app.jwt.secret=${JWT_SECRET:local-dev-jwt-secret-key-that-is-at-least-32-chars-long!}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:36000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5176}
